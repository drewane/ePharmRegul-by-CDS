{% extends "base.html" %}
{% block title %}Nouveau signalement{% endblock %}
{% block content %}
<h4 class="mb-3">Nouveau signalement de qualité</h4>
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card">
      <div class="card-body">
        <form method="post" novalidate>
          <div class="mb-3">
            <label for="produit_id" class="form-label">Produit <span class="text-danger">*</span></label>
            <select class="form-select" id="produit_id" name="produit_id" required>
              {% for p in produits %}
              <option value="{{ p.id }}">{{ p.libelle }} — {{ p.denomination_commune_internationale }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label for="numeros_lots" class="form-label">Numéros de lot concernés (séparés par des virgules, si connus)</label>
            <input type="text" class="form-control" id="numeros_lots" name="numeros_lots">
          </div>
          <div class="mb-3">
            <label for="description" class="form-label">Description du défaut <span class="text-danger">*</span></label>
            <textarea class="form-control" id="description" name="description" rows="4" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Enregistrer le signalement</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
